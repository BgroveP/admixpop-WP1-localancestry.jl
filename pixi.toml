[workspace]
channels = ["conda-forge", "bioconda"]
name = "localancestry_software"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]

[dependencies]
julia = ">=1.12.6"
aria2 = "*"
graphviz = "*"
openjdk = ">=25.0.2,<26"
openblas = ">=0.3.34,<0.4"
lapack = ">=3.11.0,<4"
autoconf = ">=2.72,<3"
libtool = ">=2.5.4,<3"
automake = ">=1.19,<2"
python = "3.14.*"
pip = ">=26.2.1,<27"
bcftools = ">=1.24,<2"
plink = ">=1.90b7.7,<2"
snakemake = ">=9.27.0,<10"
snakemake-executor-plugin-slurm = "<2.8"
zlib = ">=1.3.2,<2"
snakemake-executor-plugin-cluster-generic = ">=1.0.9,<2"
pytorch-cpu = ">=2.13.0,<3"


[activation.env]
JULIA_DEPOT_PATH = "$CONDA_PREFIX/share/julia depot"
#JULIA_PKG_OFFLINE = "true"   # avoids registry checks; optional